steps:
  # 1. Compila a imagem Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/appcuidador-23628/github.com/lucyano38/foco-em-dados-core:$COMMIT_SHA', '.']
    id: 'Build'

  # 2. Envia a imagem para o Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/appcuidador-23628/github.com/lucyano38/foco-em-dados-core:$COMMIT_SHA']
    id: 'Push'

  # 3. Realiza o deploy para o Cloud Run (foco-completo)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update'
      - 'foco-completo'
      - '--platform=managed'
      - '--image=gcr.io/appcuidador-23628/github.com/lucyano38/foco-em-dados-core:$COMMIT_SHA'
      - '--region=us-west1'
      - '--quiet'
    id: 'Deploy'

images:
  - 'gcr.io/appcuidador-23628/github.com/lucyano38/foco-em-dados-core:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
